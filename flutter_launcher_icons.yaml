# Launcher icon generation. Run: `dart run flutter_launcher_icons`
# This standalone file takes precedence over any config in pubspec.yaml.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  # Android: legacy icon + adaptive icon (API 26+).
  # "Cover" style: the artwork fills the entire adaptive canvas with no white
  # padding/letterboxing. Using the image for BOTH background and foreground
  # (with a 0% inset) means it reaches every edge; the launcher then masks it
  # to its own shape (circle / squircle / rounded square).
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/icon.png"
  adaptive_icon_foreground_inset: 0

  # iOS: App Store / home-screen icon (must be opaque, so alpha is removed).
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
